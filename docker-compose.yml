services:

  postgres:
    image: postgres:16

    container_name: witness-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Witness@123
      POSTGRES_DB: Witness

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  kafka:
   image: apache/kafka:latest

   container_name: kafka

   ports:
    - "9092:9092"

   environment:
    KAFKA_NODE_ID: 1
    KAFKA_PROCESS_ROLES: broker,controller

    KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

    KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  fastapi:
    build: .

    container_name: witness-api

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://postgres:Witness%40123@postgres:5432/Witness

    depends_on:
      - postgres
      - kafka



  projection-worker:
    build: .

    container_name: projection-worker

    command: python -u -m workers.projection_worker

    environment:
      DATABASE_URL: postgresql://postgres:Witness%40123@postgres:5432/Witness

    depends_on:
      - postgres

  saga-worker:
   build: .

   container_name: saga-worker

   command: python -u -m workers.saga_worker

   environment:
    DATABASE_URL: postgresql://postgres:Witness%40123@postgres:5432/Witness

   depends_on:
    - postgres

  outbox-worker:
    build: .

    container_name: outbox-worker

    command: python -u -m workers.outbox_worker

    environment:
      DATABASE_URL: postgresql://postgres:Witness%40123@postgres:5432/Witness

    depends_on:
      - postgres
      - kafka

volumes:
  postgres_data: